# Uso (desarrollo):
#   docker compose up --build
# Uso (produccion local):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# En Render NO se usa este archivo: Render construye el Dockerfile del repo y
# recibe la base de datos desde DATABASE_URL.

name: dockerize

services:
  # ---------- Base de datos PostgreSQL -------------------------------------
  db:
    image: postgres:16
    container_name: dockerize_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docker_basico}
      POSTGRES_USER: ${POSTGRES_USER:-dockerize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dockerize}
      TZ: ${TZ:-America/Bogota}
    ports:
      # Puerto publicado en tu maquina. Dentro del contenedor siempre es 5432.
      # 5433 por defecto porque el 5432 del host suele estar ocupado por un
      # PostgreSQL local; cámbialo con DB_PORT en el .env de la raíz.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-dockerize} -d ${POSTGRES_DB:-docker_basico}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - dockerize

  # ---------- Aplicacion Django -------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockerize_web
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Dentro de la red de Docker el host de la base es el servicio "db".
      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-dockerize}:${POSTGRES_PASSWORD:-dockerize}@db:5432/${POSTGRES_DB:-docker_basico}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      TZ: ${TZ:-America/Bogota}
      DJANGO_CARGAR_DATOS: ${DJANGO_CARGAR_DATOS:-1}
      PORT: ${WEB_PORT:-8000}
      DB_WAIT_ATTEMPTS: 40
    ports:
      - "${WEB_PORT:-8000}:${WEB_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dockerize

  # ---------- Cliente SQL (perfil opcional) -------------------------------
  adminer:
    image: adminer:5
    container_name: dockerize_adminer
    restart: unless-stopped
    environment:
      # Adminer abre PostgreSQL con una DSN.
      ADMINER_DEFAULT_SERVER: >-
        postgres://${POSTGRES_USER:-dockerize}:${POSTGRES_PASSWORD:-dockerize}@db:5432/${POSTGRES_DB:-docker_basico}
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - dockerize

volumes:
  db_data:

networks:
  dockerize:
    driver: bridge
