# Uso (desarrollo):
#   docker compose up --build
# Uso (produccion):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

name: dockerize

services:
  # ---------- Base de datos MySQL -----------------------------------------
  db:
    image: mysql:8.0
    container_name: dockerize_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docker_basico}
      # Usuario dedicado para la app (MySQL no admite MYSQL_USER=root)
      MYSQL_USER: ${MYSQL_APP_USER:-dockerize}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-dockerize}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD:-root}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - dockerize

  # ---------- Aplicacion Django -------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockerize_web
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Dentro de la red de Docker el host de MySQL es el servicio "db"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docker_basico}
      MYSQL_USER: ${MYSQL_APP_USER:-dockerize}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-dockerize}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      TZ: ${TZ:-America/Bogota}
      DJANGO_CARGAR_DATOS: ${DJANGO_CARGAR_DATOS:-1}
      DB_WAIT_ATTEMPTS: 40
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dockerize

  # ---------- MySQL Admin (perfil opcional) -------------------------------
  adminer:
    image: adminer:5
    container_name: dockerize_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    networks:
      - dockerize

volumes:
  db_data:

networks:
  dockerize:
    driver: bridge
